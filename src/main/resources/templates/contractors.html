<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contractor Management</title>

    <link rel="stylesheet" href="/style.css">

    <style>

        .page-container {
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
        }

        .add-button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button:hover {
            background: #d97706;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .save-button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cancel-button {
            background: #6b7280;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .edit-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f8f9fa;
        }

        .hidden {
            display: none;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            table {
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">C</div>

            <div>
                <h2>CONSTRUCT</h2>
                <span>MANAGEMENT</span>
            </div>

        </div>

        <nav>

            <a href="/dashboard" class="nav-item">
                <span>▦</span>
                Dashboard
            </a>

            <a href="/projects" class="nav-item">
                <span>▤</span>
                Projects
            </a>

            <a href="/clients" class="nav-item">
                <span>👤</span>
                Clients
            </a>

            <a href="/contractors" class="nav-item active">
                <span>🏗</span>
                Contractors
            </a>

            <a href="/sites" class="nav-item">
                <span>⌂</span>
                Sites
            </a>

            <div class="nav-group">

                <a href="/workforce" class="nav-item">
                    <span>◉</span>
                    Workforce
                </a>

                <a href="/attendance" class="nav-sub-item">
                    <span>✓</span>
                    Attendance
                </a>

            </div>

            <a href="/inventory" class="nav-item">
                <span>▣</span>
                Inventory
            </a>

            <a href="/equipment" class="nav-item">
                <span>⚙</span>
                Equipment
            </a>

            <a href="/daily-logs" class="nav-item">
                <span>☷</span>
                Daily Logs
            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="system-status">
                <span class="status-dot"></span>
                System Online
            </div>

        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="page-container">

            <div class="page-header">

                <div>

                    <h1>Contractor Management</h1>

                    <p>
                        Manage contractor profiles and contact information.
                    </p>

                </div>

                <button
                        class="add-button"
                        onclick="showAddForm()">

                    + Add Contractor

                </button>

            </div>


            <div id="message" class="message"></div>


            <!-- ADD / EDIT FORM -->

            <div id="contractorFormCard" class="card hidden">

                <h2 id="formTitle">
                    Add Contractor
                </h2>

                <input
                        type="hidden"
                        id="contractorId">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Contractor Name</label>

                        <input
                                type="text"
                                id="contractorName"
                                required>

                    </div>


                    <div class="form-group">

                        <label>Phone</label>

                        <input
                                type="text"
                                id="phone">

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                                type="email"
                                id="email">

                    </div>


                    <div class="form-group">

                        <label>Address</label>

                        <input
                                type="text"
                                id="address">

                    </div>

                </div>


                <div class="form-actions">

                    <button
                            class="save-button"
                            onclick="saveContractor()">

                        Save

                    </button>

                    <button
                            class="cancel-button"
                            onclick="hideForm()">

                        Cancel

                    </button>

                </div>

            </div>


            <!-- CONTRACTOR TABLE -->

            <div class="card">

                <h2>Contractors</h2>

                <table>

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody id="contractorTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

    let editingContractorId = null;


    // READ
    async function loadContractors() {

        try {

            const response =
                await fetch('/api/contractors');

            if (!response.ok) {
                throw new Error('Failed to load contractors');
            }

            const contractors =
                await response.json();

            const tableBody =
                document.getElementById('contractorTableBody');

            tableBody.innerHTML = '';

            contractors.forEach(contractor => {

                const row =
                    document.createElement('tr');

                row.innerHTML = `

                    <td>${contractor.contractorId}</td>

                    <td>${contractor.contractorName || ''}</td>

                    <td>${contractor.phone || ''}</td>

                    <td>${contractor.email || ''}</td>

                    <td>${contractor.address || ''}</td>

                    <td>

                        <button
                            class="edit-button"
                            onclick="editContractor(${contractor.contractorId})">

                            Edit

                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteContractor(${contractor.contractorId})">

                            Delete

                        </button>

                    </td>

                `;

                tableBody.appendChild(row);

            });

        } catch (error) {

            showMessage(
                'Could not load contractors.',
                'error'
            );

        }

    }


    // SHOW ADD FORM
    function showAddForm() {

        editingContractorId = null;

        document.getElementById('formTitle')
            .textContent = 'Add Contractor';

        document.getElementById('contractorId')
            .value = '';

        document.getElementById('contractorName')
            .value = '';

        document.getElementById('phone')
            .value = '';

        document.getElementById('email')
            .value = '';

        document.getElementById('address')
            .value = '';

        document.getElementById('contractorFormCard')
            .classList.remove('hidden');

    }


    // HIDE FORM
    function hideForm() {

        document.getElementById('contractorFormCard')
            .classList.add('hidden');

    }


    // CREATE / UPDATE
    async function saveContractor() {

        const contractor = {

            contractorName:
            document.getElementById('contractorName').value,

            phone:
            document.getElementById('phone').value,

            email:
            document.getElementById('email').value,

            address:
            document.getElementById('address').value

        };


        if (!contractor.contractorName.trim()) {

            showMessage(
                'Contractor name is required.',
                'error'
            );

            return;

        }


        try {

            let response;

            if (editingContractorId === null) {

                response = await fetch(
                    '/api/contractors',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(contractor)
                    }
                );

            } else {

                response = await fetch(
                    `/api/contractors/${editingContractorId}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(contractor)
                    }
                );

            }


            if (!response.ok) {
                throw new Error('Save failed');
            }


            const wasEditing =
                editingContractorId !== null;

            hideForm();

            await loadContractors();

            showMessage(
                wasEditing
                    ? 'Contractor updated successfully.'
                    : 'Contractor created successfully.',
                'success'
            );

            editingContractorId = null;

        } catch (error) {

            showMessage(
                'Could not save contractor.',
                'error'
            );

        }

    }


    // EDIT
    async function editContractor(id) {

        try {

            const response =
                await fetch(`/api/contractors/${id}`);

            if (!response.ok) {
                throw new Error('Contractor not found');
            }

            const contractor =
                await response.json();

            editingContractorId = id;

            document.getElementById('formTitle')
                .textContent = 'Edit Contractor';

            document.getElementById('contractorId')
                .value = contractor.contractorId;

            document.getElementById('contractorName')
                .value = contractor.contractorName || '';

            document.getElementById('phone')
                .value = contractor.phone || '';

            document.getElementById('email')
                .value = contractor.email || '';

            document.getElementById('address')
                .value = contractor.address || '';

            document.getElementById('contractorFormCard')
                .classList.remove('hidden');

        } catch (error) {

            showMessage(
                'Could not load contractor.',
                'error'
            );

        }

    }


    // DELETE
    async function deleteContractor(id) {

        if (!confirm(
            'Are you sure you want to delete this contractor?'
        )) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/contractors/${id}`,
                    {
                        method: 'DELETE'
                    }
                );


            if (!response.ok) {
                throw new Error('Delete failed');
            }


            await loadContractors();

            showMessage(
                'Contractor deleted successfully.',
                'success'
            );

        } catch (error) {

            showMessage(
                'Could not delete contractor. The contractor may be linked to a project.',
                'error'
            );

        }

    }


    // MESSAGE
    function showMessage(text, type) {

        const message =
            document.getElementById('message');

        message.textContent = text;

        message.className =
            `message ${type}`;

        message.style.display = 'block';


        setTimeout(() => {

            message.style.display = 'none';

        }, 3000);

    }


    // LOAD DATA
    loadContractors();

</script>

</body>

</html>
